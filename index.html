<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="multiselect.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>JS-Multiselect</h1>

    <template id="multiselect-template">
      <div class="multi-select">
                <!-- ${this.selectedValues.map(value => `<input type="hidden" name="${this.name}[]" value="${value}">`).join('')} -->
                 <div class="multi-select-values"></div>
                <div class="multi-select-header">
                    <span class="multi-select-header-max">
                        <!-- ${this.options.max ? this.selectedValues.length + '/' + this.options.max : ''} -->
                    </span>
                    <span class="multi-select-header-placeholder"></span>
                </div>
                <div class="multi-select-options">
                </div>
        </div>
    </template>

    <select id="fruits" name="fruits" data-placeholder="Select fruits" multiple data-multi-select>
        <option value="Apple" disabled>Apple</option>
        <option value="Banana">Banana</option>
        <option value="Blackberry">Blackberry</option>
        <option value="Blueberry">Blueberry</option>
        <option value="Cherry">Cherry</option>
        <option value="Cranberry">Cranberry</option>
        <option value="Grapes">Grapes</option>
        <option value="Kiwi">Kiwi</option>
        <option value="Mango">Mango</option>
        <option value="Orange">Orange</option>
        <option value="Peach">Peach</option>
        <option value="Pear">Pear</option>
        <option value="Pineapple">Pineapple</option>
        <option value="Raspberry">Raspberry</option>
        <option value="Strawberry">Strawberry</option>
        <option value="Watermelon">Watermelon</option>
    </select>

    <script>

      const multiselect = new Multiselect(
        document.getElementById("fruits"),
        {
           // options: options,
            placeholder: "Select options",
            max: 5,
        }
      );
    </script>
  </body>
</html>
